<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup2.css">
</head>
<body>
  <header>
    <div class="title"><span class="dot"></span> Growth Hack GS AI <span id="verTag" style="font-weight:400;font-size:10px;color:#9ca3af">v1.0.5</span></div>
    <div id="sheetInfo" class="muted"></div>
    <button id="refreshBtn2" class="btn" title="Reload the current page" style="padding:2px 8px;font-size:11px">Refresh</button>
  </header>
  <div id="diag" style="display:none;font-size:10px;color:#b45309;background:#fef3c7;border:1px solid #f59e0b;border-radius:6px;padding:4px 8px;margin-bottom:8px"></div>

  <section id="sheetInputWrap">
    <label for="sheetId">Google Sheet URL or ID</label>
    <div class="row">
      <input id="sheetId" type="text" placeholder="https://docs.google.com/spreadsheets/d/...">
      <button id="refreshBtn" class="btn" title="Reload the current page">Refresh</button>
      <button id="loadBtn" class="btn">Load</button>
    </div>
  </section>

  <section id="loginWrap">
    <label for="loginEmail">Screener login (needed for Results / Full-text search)</label>
    <input id="loginEmail" type="email" placeholder="screener email" autocomplete="username">
    <input id="loginPass" type="password" placeholder="screener password" autocomplete="current-password" style="width:100%;margin-top:6px">
    <div class="row between" style="margin-top:8px">
      <label class="chk" style="margin:0"><input type="checkbox" id="rememberChk"> Remember</label>
      <button id="loginBtn" class="btn primary">Login to Screener</button>
    </div>
    <div class="muted" id="loginState">Checking login…</div>
  </section>

  <section id="controls" hidden>
    <div class="row between">
      <label class="chk"><input type="checkbox" id="appendChk" checked> Append (keep existing rows)</label>
      <label class="chk"><input type="checkbox" id="replaceChk"> Replace tab</label>
    </div>
    <div class="row between">
      <label title="Scrape = pages (0 = all). Details/AI = rows. 0/all = everything; 4 = row 4; 4,7 = rows 4 & 7; 4-7 = rows 4..7; 4-7,9 = mixed.">Pages / Rows (0=all): <input type="text" id="limitInput" value="0" style="width:64px"></label>
      <div class="row">
        <button id="stopBtn" class="btn" disabled>Stop</button>
        <button id="scrapeAllBtn" class="btn primary" disabled>Scrape All</button>
      </div>
    </div>
    <div class="muted" style="margin-top:6px">AI button runs the first N rows through ChatGPT (web search ON) and writes the JSON reply into the "AI Research (JSON)" column.</div>
  </section>

  <section id="itemsWrap" hidden>
    <div class="items"></div>
  </section>

  <section id="log" hidden></section>

  <div id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Replace tab?</h3>
      <p id="modalMsg">Existing data will be cleared.</p>
      <div class="modal-actions">
        <button id="modalCancelBtn" class="btn">Cancel</button>
        <button id="modalOkBtn" class="btn danger">Replace</button>
      </div>
    </div>
  </div>

  <script src="popup2.js"></script>
</body>
</html>
